// * the repositories definition is in 'settings.gradle'
// * the dependencies definition is found in 'gradle/libs.versions.toml'
// * this buildfile was written for gradle 8.14.X

plugins {
    id 'java'
    alias(libs.plugins.springboot)
    alias(libs.plugins.vaadin)
}


group = 'com.example'
version = '1.0-SNAPSHOT'

vaadin {
    // to use '-Pvaadin.productionMode' we need the entry below, otherwise only '-Dvaadin.productionMode' is possible
    productionMode = project.hasProperty('vaadin.productionMode') ? project.property('vaadin.productionMode').toBoolean() : false
}

java {
    toolchain {
        // read the java version from our gradle/libs.versions.toml file:
        languageVersion = JavaLanguageVersion.of("${libs.versions.java.get()}")
    }
}

tasks.withType(JavaCompile) {
    options.deprecation = true
}

dependencies {
    
    // see gradle/libs.versions.toml for the definition/versions of the libs/bundles/plugins
    
    implementation      platform(libs.bom.springboot)
    implementation      platform(libs.bom.vaadin)
    
    // IMPORTANT: we have to register the BOMs for 'developmentOnly' configuration
    // otherwise when doing a build, the 'bootJar' task will fail, since it
    // does not have any version information.
    // In the past this was automatically done by the 'io.spring.dependency-management'
    // plugin, but since we do not use that anymore because of the native gradle
    // support for BOMs, we have to do this explicit declaration.
    // When running with 'bootRun' or from the IDE, everythings works fine,
    // the problem only shows when doing a build on the commandline.
    developmentOnly     platform(libs.bom.springboot)
    developmentOnly     platform(libs.bom.vaadin)

    implementation      libs.bundles.app.impl
    runtimeOnly         libs.bundles.app.rtonly
    testImplementation  libs.bundles.app.testimpl
    developmentOnly     libs.bundles.app.devonly
}

tasks.named('test') {
    useJUnitPlatform()
}

